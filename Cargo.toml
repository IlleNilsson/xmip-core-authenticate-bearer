[package]
name = "xmip-core-authenticate-bearer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-bearer"
description = "Authenticate by bearer token: verifies an opaque token against a token store, hashed at rest, with its expiry. A xmip-core-authenticate technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md), and on no sibling (ADR-0050 section 6). The
# mechanism catalog is xmip-core's and the verdict is xmip-core-context's.
authenticate = { workspace = true }
# identify for the Authorization header, read once for both gates.
identify = { workspace = true }
xcore = { workspace = true }
context = { workspace = true }
# The estate's SHA-256 a token is held by (codec::digest).
codec = { workspace = true }

[lints]
workspace = true
